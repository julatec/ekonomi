# TEMPORAL -- siembra el Issuer/User de Killa. Sacar esta línea (y volver a
# desplegar) una vez que SembradorKilla confirme por log que guardó las dos
# filas: es inofensivo dejarla puesta mientras tanto -- SembradorKilla nunca
# tumba el arranque si falla (la base sigue en --read-only, aparte de esta
# tarea) y save() es upsert por @Id, así que reintentar en cada boot no
# duplica nada una vez que sí pueda escribir.
#
# spring.profiles.include (no .active): catalina.properties ya fija
# spring.profiles.active=production para todo Tomcat, compartido con ROOT --
# .active de acá lo reemplazaría entero; .include se suma sin tocarlo.
spring.profiles.include=seed-killa
spring.main.allow-bean-definition-overriding=true
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.jpa.hibernate.ddl-auto=update
server.error.path=/error

name.julatec.ekonomi.storage.security.datasource=java:comp/env/jdbc/ekonomiPrimary
name.julatec.ekonomi.storage.tenants.default=julatec
name.julatec.ekonomi.storage.tenants={\
  julatec: 'java:comp/env/jdbc/ekonomiJulatec',\
  tribuconta: 'java:comp/env/jdbc/ekonomiTribuconta'\
}


# --- Servidor MCP -----------------------------------------------------------
# Las herramientas viven en el modulo mcp-server; esto es solo el transporte.
# Cuelga de /mcp sobre el mismo Tomcat, asi que queda detras de la cadena de
# Spring Security: anyRequest().authenticated() con X.509. No hay ruta abierta.
spring.ai.mcp.server.name=ekonomi
spring.ai.mcp.server.version=0.2.0
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.instructions=Consulta de solo lectura sobre la contabilidad de Ekonomi \
  (facturas electronicas de Costa Rica, notas de credito y debito) y generacion de los \
  reportes auxiliares de compras y ventas. Empezar por `listar_tenants`: toda herramienta \
  exige un tenant de esa lista, que sale del certificado presentado. Las fechas van \
  AAAA-MM-DD. Los montos estan en la moneda del documento; multiplicar por tipoCambio da \
  colones. Las notas de credito restan: `resumen_periodo` las reporta aparte a proposito.
