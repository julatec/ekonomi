# Ekonomi Docker Profile Configuration
# This profile is used when running the application against Docker services

# Thymeleaf
spring.main.allow-bean-definition-overriding=true
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Primary Datasource (Security)
spring.datasource.url=jdbc:mysql://localhost:3306/ekonomi_primary?useSSL=false&serverTimezone=America/Costa_Rica&allowPublicKeyRetrieval=true
spring.datasource.username=ekonomi
spring.datasource.password=ekonomi_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ekonomi Multi-tenant Configuration
name.julatec.ekonomi.storage.security.datasource=jdbc:mysql://localhost:3306/ekonomi_primary?useSSL=false&serverTimezone=America/Costa_Rica&allowPublicKeyRetrieval=true
name.julatec.ekonomi.storage.tenants.default=julatec
name.julatec.ekonomi.storage.tenants.julatec=jdbc:mysql://localhost:3306/ekonomi_julatec?useSSL=false&serverTimezone=America/Costa_Rica&allowPublicKeyRetrieval=true
name.julatec.ekonomi.storage.tenants.tribuconta=jdbc:mysql://localhost:3306/ekonomi_tribuconta?useSSL=false&serverTimezone=America/Costa_Rica&allowPublicKeyRetrieval=true

# Mail Configuration (MailHog)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging
logging.level.name.julatec=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
