# Ambiente local de iteracion rapida — MySQL de docker-compose, sin JNDI.
#
# NO reemplaza al Tomcat de /opt/tomcat: ahi se prueba el X.509 con la tarjeta contra el
# esquema real, que es la validacion previa al despliegue. Esto es para iterar sobre la UI
# y la API sin tocar produccion.
#
# Se activa con: mvn spring-boot:run -Dspring-boot.run.profiles=local

# Los datasources los arma LocalDataSourceConfig con estas propiedades, no por JNDI.
#
# 🔴 127.0.0.1:3307, NO localhost:3306. En esta maquina suele haber un tunel SSH
# `-L 3306:julatec.name:3306` a la base de PRODUCCION atado a 127.0.0.1:3306. Con el
# puerto por omision, localhost resuelve al tunel antes que al contenedor, y este perfil
# corre con hbm2ddl.auto=update: le haria DDL a la contabilidad real. El docker-compose
# publica en 3307 (MYSQL_PORT en .env) justamente para que no puedan colisionar.
name.julatec.ekonomi.local.db.url-prefix=jdbc:mariadb://127.0.0.1:3307/
name.julatec.ekonomi.local.db.username=ekonomi
name.julatec.ekonomi.local.db.password=ekonomi_password
name.julatec.ekonomi.local.db.schema-prefix=ekonomi_
name.julatec.ekonomi.local.db.security-schema=primary

# Los esquemas de docker arrancan vacios: aca Hibernate si crea las tablas.
# Contra la base real esto queda en `none`, que es el valor por omision.
name.julatec.ekonomi.storage.ddl-auto=update

# El dev server de Vite corre en otro puerto; en produccion la lista va vacia porque
# todo se sirve del mismo origen. Van los dos nombres porque el mismo servidor responde
# como `localhost` y como `ekonomi.promyse.home.julatec.name`, y para el navegador son
# origenes distintos.
name.julatec.ekonomi.cors.allowed-origins=http://localhost:5173,https://localhost:5173,http://ekonomi.promyse.home.julatec.name:5173,https://ekonomi.promyse.home.julatec.name:5173

# El asistente necesita a pitia; en local queda apagado salvo que se prenda a mano.
ekonomi.chat.enabled=false

# --- mTLS local ---------------------------------------------------------------
# La aplicacion autentica SOLO por X.509, asi que sin esto no se llega ni al 401 y no hay
# forma de abrir la UI. El material lo genera `make dev-certs` (docker/certs/, gitignored).
#
# client-auth=need, igual que produccion: NO se relaja la cadena de seguridad para el
# ambiente local. `optional` ademas no funciona con TLS 1.3 — Tomcat avisa que la
# implementacion JSSE no soporta post-handshake authentication.
#
# 🔑 EL TRUSTSTORE ES LO QUE DECIDE SI EL NAVEGADOR TE OFRECE UN CERTIFICADO.
# En el handshake el conector anuncia que CAs acepta, y el navegador solo ofrece
# certificados que encajen. Si acá falta la CA que emitio el certificado que tenés en el
# llavero, no aparece ningun dialogo y la conexion entra SIN certificado: es un silencio,
# no un rechazo. `make certs-thot` deja adentro tanto `Ekonomi Dev CA` (el `CN=dev` que
# usan los scripts y el proxy de Vite) como `Julatec CA Raiz`/`Clientes` (el certificado
# de persona con el que se entra desde el navegador).
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:../docker/certs/servidor-local.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.trust-store=file:../docker/certs/dev-truststore.p12
server.ssl.trust-store-password=changeit
server.ssl.trust-store-type=PKCS12
server.ssl.client-auth=need
